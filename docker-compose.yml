services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: texas-server
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - texas

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: texas-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - texas

networks:
  texas:
    driver: bridge
