services:
  mongo:
    image: mongo:7
    container_name: texas-mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - texas

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: texas-server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: texas
    expose:
      - "8080"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - texas

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: texas-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - texas

networks:
  texas:
    driver: bridge

volumes:
  mongo_data:
